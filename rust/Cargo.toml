[package]
name = "react_gpui_desktop"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", features = ["napi6"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui = { path = "../../zed/crates/gpui" }
gpui_platform = { path = "../../zed/crates/gpui_platform" }

[build-dependencies]
napi-build = "2"
